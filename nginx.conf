user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Optimizaciones para alta concurrencia
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $http_x_api_key zone=api_key_limit:10m rate=1000r/s;
    
    # Upstream servers (Kinetix API instances)
    upstream kinetix_api {
        least_conn;  # Load balancing algorithm
        
        server kinetix-api-1:8000 weight=1 max_fails=3 fail_timeout=30s;
        server kinetix-api-2:8000 weight=1 max_fails=3 fail_timeout=30s;
        server kinetix-api-3:8000 weight=1 max_fails=3 fail_timeout=30s;
        
        keepalive 32;  # Connection pooling
    }

    # ============================================================================
    # HTTP to HTTPS Redirect
    # ============================================================================
    
    server {
        listen 80;
        server_name _;
        
        location / {
            return 301 https://$host$request_uri;
        }
        
        # Allow acme-challenge without redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ============================================================================
    # HTTPS Server
    # ============================================================================
    
    server {
        listen 443 ssl http2;
        server_name localhost *.azurewebsites.net *.example.com;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ====================================================================
        # Health Check Endpoint (priority: highest)
        # ====================================================================
        
        location /health {
            access_log off;
            
            proxy_pass http://kinetix_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Health check should be fast
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        # ====================================================================
        # Readiness Check
        # ====================================================================
        
        location /health/ready {
            access_log off;
            
            proxy_pass http://kinetix_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ====================================================================
        # API Routes
        # ====================================================================
        
        location / {
            # Rate limiting
            limit_req zone=api_limit burst=200 nodelay;
            limit_req_status 429;

            # Proxy settings
            proxy_pass http://kinetix_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Retries on failure
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # ====================================================================
        # API Documentation
        # ====================================================================
        
        location /api/docs {
            proxy_pass http://kinetix_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/redoc {
            proxy_pass http://kinetix_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================================
        # Metrics Endpoint (protected)
        # ====================================================================
        
        location /metrics {
            auth_basic "Metrics";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://kinetix_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ====================================================================
        # 404 Error Page
        # ====================================================================
        
        error_page 404 /404.json;
        location = /404.json {
            internal;
            default_type application/json;
            return 404 '{"error":"Not found","status":404}';
        }

        # ====================================================================
        # Error Pages
        # ====================================================================
        
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 503 '{"error":"Service temporarily unavailable","status":503}';
        }
    }

    # ============================================================================
    # Status and Metrics (internal only)
    # ============================================================================
    
    server {
        listen 8888;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }
    }
}
